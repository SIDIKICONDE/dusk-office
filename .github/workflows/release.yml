name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build, publish to Marketplaces, create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches package.json version
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          echo "Tag version : $TAG_VERSION"
          echo "package.json: $PKG_VERSION"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag (v$TAG_VERSION) does not match package.json ($PKG_VERSION)."
            exit 1
          fi

      - name: Syntax check (extension.js + lib + scripts)
        run: |
          node --check extension.js
          for f in lib/*.js; do node --check "$f" || exit 1; done
          for f in scripts/*.mjs; do node --check "$f" || exit 1; done

      - name: Validate themes (palette, pipeline, terminal contrast)
        run: npm run validate

      - name: Unit tests
        run: npm test

      - name: Package VSIX
        run: npm run package

      - name: Resolve VSIX path
        id: vsix
        run: |
          VSIX_FILE=$(ls dusk-office-*.vsix | head -n 1)
          if [ -z "$VSIX_FILE" ]; then
            echo "::error::No VSIX found after npm run package."
            exit 1
          fi
          echo "path=$VSIX_FILE" >> "$GITHUB_OUTPUT"
          echo "Resolved VSIX: $VSIX_FILE"

      - name: Publish to Visual Studio Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "::warning::VSCE_PAT secret not set; skipping VS Marketplace publish."
            exit 0
          fi
          # Diagnostic: secret length without revealing the value (PAT should be 84 chars)
          echo "VSCE_PAT length: ${#VSCE_PAT}"
          # vsce reads VSCE_PAT from env automatically, no need for -p flag
          npx --no-install @vscode/vsce publish --packagePath "${{ steps.vsix.outputs.path }}"

      - name: Publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "$OVSX_PAT" ]; then
            echo "::warning::OVSX_PAT secret not set; skipping Open VSX publish."
            exit 0
          fi
          npx --no-install ovsx publish "${{ steps.vsix.outputs.path }}" -p "$OVSX_PAT"

      - name: Setup Java (JetBrains plugin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Export IDE themes + sync JetBrains plugin
        run: |
          npm run export:ide
          npm run jetbrains:sync

      - name: Build JetBrains plugin ZIP
        run: cd jetbrains-plugin && chmod +x gradlew && ./gradlew buildPlugin --no-daemon

      - name: Publish to JetBrains Marketplace
        env:
          JETBRAINS_TOKEN: ${{ secrets.JETBRAINS_TOKEN }}
        run: |
          if [ -z "$JETBRAINS_TOKEN" ]; then
            echo "::warning::JETBRAINS_TOKEN secret not set; skipping JetBrains Marketplace publish."
            exit 0
          fi
          cd jetbrains-plugin && ./gradlew publishPlugin --no-daemon

      - name: Resolve JetBrains plugin ZIP
        id: jetbrains_zip
        run: |
          ZIP=$(ls jetbrains-plugin/build/distributions/dusk-office-jetbrains-*.zip 2>/dev/null | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "::warning::JetBrains plugin ZIP not found."
            echo "path=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "path=$ZIP" >> "$GITHUB_OUTPUT"
          echo "Resolved JetBrains ZIP: $ZIP"

      - name: Extract changelog section for this version
        id: changelog
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          # Extract everything from "## VERSION" up to the next "## " (exclusive)
          BODY=$(awk -v v="$VERSION" '
            $0 ~ "^## "v" " { found=1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md)
          if [ -z "$BODY" ]; then
            BODY="See CHANGELOG.md for the full release notes."
          fi
          {
            echo 'body<<__EOF__'
            echo "$BODY"
            echo '__EOF__'
          } >> "$GITHUB_OUTPUT"

      - name: Prepare GitHub Release assets
        id: release_assets
        run: |
          ASSETS="${{ steps.vsix.outputs.path }}"
          JB="${{ steps.jetbrains_zip.outputs.path }}"
          if [ -n "$JB" ] && [ -f "$JB" ]; then
            ASSETS="${ASSETS}"$'\n'"${JB}"
          fi
          echo "paths<<__EOF__" >> "$GITHUB_OUTPUT"
          echo "$ASSETS" >> "$GITHUB_OUTPUT"
          echo "__EOF__" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Dusk Office ${{ github.ref_name }}
          body: ${{ steps.changelog.outputs.body }}
          files: ${{ steps.release_assets.outputs.paths }}
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
