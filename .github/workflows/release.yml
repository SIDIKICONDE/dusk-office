name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  vsix:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - run: npm run validate

      - run: npm run package

      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: "*.vsix"

      - name: Publish to Visual Studio Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "VSCE_PAT non défini — VSIX uniquement en artefact."
            exit 0
          fi
          npx --yes @vscode/vsce@^3.2.2 publish --no-dependencies -p "$VSCE_PAT"
