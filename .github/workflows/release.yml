name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build, publish to Marketplaces, create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          npm ci
          pip install -e ".[dev]"

      - name: Verify tag, package.json version, and CHANGELOG
        env:
          GITHUB_REF: ${{ github.ref }}
        run: npm run release-check

      - name: Syntax check (extension.js + lib + scripts)
        run: |
          node --check extension.js
          find lib -name '*.js' -print0 | while IFS= read -r -d '' f; do node --check "$f" || exit 1; done
          for f in scripts/*.mjs; do node --check "$f" || exit 1; done

      - name: Regenerate themes and verify committed output
        run: npm run verify:themes-fresh

      - name: Unit tests
        run: npm run test:all

      - name: Package VSIX
        run: npm run package

      - name: Resolve VSIX path
        id: vsix
        run: |
          VSIX_FILE=$(ls dusk-office-*.vsix | head -n 1)
          if [ -z "$VSIX_FILE" ]; then
            echo "::error::No VSIX found after npm run package."
            exit 1
          fi
          echo "path=$VSIX_FILE" >> "$GITHUB_OUTPUT"
          echo "Resolved VSIX: $VSIX_FILE"

      - name: Publish to Visual Studio Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "::error::VSCE_PAT secret is not set; refusing to publish without VS Marketplace."
            exit 1
          fi
          echo "VSCE_PAT length: ${#VSCE_PAT}"
          npx --no-install @vscode/vsce publish --packagePath "${{ steps.vsix.outputs.path }}"

      - name: Publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "$OVSX_PAT" ]; then
            echo "::error::OVSX_PAT secret is not set; refusing to publish without Open VSX."
            exit 1
          fi
          npx --no-install ovsx publish "${{ steps.vsix.outputs.path }}" -p "$OVSX_PAT"

      - name: Setup Java (JetBrains plugin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Export IDE themes + sync JetBrains plugin
        run: |
          npm run export:ide
          npm run jetbrains:sync

      - name: Build JetBrains plugin ZIP
        run: node scripts/run-gradle.mjs buildPlugin --no-daemon

      - name: Publish to JetBrains Marketplace
        env:
          JETBRAINS_TOKEN: ${{ secrets.JETBRAINS_TOKEN }}
        run: |
          if [ -z "$JETBRAINS_TOKEN" ]; then
            echo "::error::JETBRAINS_TOKEN secret is not set; refusing to publish without JetBrains Marketplace."
            exit 1
          fi
          node scripts/run-gradle.mjs publishPlugin --no-daemon

      - name: Resolve JetBrains plugin ZIP
        id: jetbrains_zip
        run: |
          ZIP=$(ls jetbrains-plugin/build/distributions/dusk-office-jetbrains-*.zip 2>/dev/null | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "::error::JetBrains plugin ZIP not found after buildPlugin."
            exit 1
          fi
          echo "path=$ZIP" >> "$GITHUB_OUTPUT"
          echo "Resolved JetBrains ZIP: $ZIP"

      - name: Extract changelog section for this version
        id: changelog
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          BODY=$(awk -v v="$VERSION" '
            $0 ~ "^## "v" " { found=1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md)
          if [ -z "$BODY" ]; then
            echo "::error::CHANGELOG.md is missing a section for version $VERSION."
            exit 1
          fi
          {
            echo 'body<<__EOF__'
            echo "$BODY"
            echo '__EOF__'
          } >> "$GITHUB_OUTPUT"

      - name: Prepare GitHub Release assets
        id: release_assets
        run: |
          ASSETS="${{ steps.vsix.outputs.path }}"
          JB="${{ steps.jetbrains_zip.outputs.path }}"
          ASSETS="${ASSETS}"$'\n'"${JB}"
          echo "paths<<__EOF__" >> "$GITHUB_OUTPUT"
          echo "$ASSETS" >> "$GITHUB_OUTPUT"
          echo "__EOF__" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Dusk Office ${{ github.ref_name }}
          body: ${{ steps.changelog.outputs.body }}
          files: ${{ steps.release_assets.outputs.paths }}
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
