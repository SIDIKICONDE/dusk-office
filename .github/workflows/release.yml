name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build, publish to Marketplaces, create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          npm ci
          pip install -e ".[dev]"

      - name: Verify tag, package.json version, and CHANGELOG
        env:
          GITHUB_REF: ${{ github.ref }}
        run: npm run release-check

      - name: Syntax check (extension.js + lib + scripts)
        run: |
          node --check extension.js
          find lib -name '*.js' -print0 | while IFS= read -r -d '' f; do node --check "$f" || exit 1; done
          for f in scripts/*.mjs; do node --check "$f" || exit 1; done

      - name: Regenerate themes and verify committed output
        run: npm run verify:themes-fresh

      - name: Unit tests
        run: npm run test:all

      # --- Build artifacts (VSIX + JetBrains ZIP) before any marketplace publish ---
      - name: Package VSIX
        run: npm run package

      - name: Resolve VSIX path
        id: vsix
        run: |
          VSIX_FILE=$(ls dusk-office-*.vsix | head -n 1)
          if [ -z "$VSIX_FILE" ]; then
            echo "::error::No VSIX found after npm run package."
            exit 1
          fi
          echo "path=$VSIX_FILE" >> "$GITHUB_OUTPUT"
          echo "Resolved VSIX: $VSIX_FILE"

      - name: Setup Java (JetBrains plugin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build JetBrains plugin ZIP
        run: npm run jetbrains:build

      - name: Resolve JetBrains plugin ZIP
        id: jetbrains_zip
        run: |
          ZIP=$(ls jetbrains-plugin/build/distributions/dusk-office-jetbrains-*.zip 2>/dev/null | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "::error::JetBrains plugin ZIP not found after jetbrains:build."
            exit 1
          fi
          echo "path=$ZIP" >> "$GITHUB_OUTPUT"
          echo "Resolved JetBrains ZIP: $ZIP"

      # --- Publish to marketplaces (skip when version already published) ---
      - name: Publish to Visual Studio Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: node scripts/publish-release.mjs vsce --package "${{ steps.vsix.outputs.path }}"

      - name: Publish to JetBrains Marketplace
        env:
          JETBRAINS_TOKEN: ${{ secrets.JETBRAINS_TOKEN }}
        run: node scripts/publish-release.mjs jetbrains

      - name: Publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: node scripts/publish-release.mjs ovsx --package "${{ steps.vsix.outputs.path }}"

      - name: Create or update GitHub Release
        env:
          GITHUB_REF: ${{ github.ref }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/create-github-release.mjs \
            --vsix "${{ steps.vsix.outputs.path }}" \
            --jetbrains "${{ steps.jetbrains_zip.outputs.path }}"
