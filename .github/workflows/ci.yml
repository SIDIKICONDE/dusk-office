name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validate themes & pipeline
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          npm ci
          pip install -e ".[dev]"

      - name: Install Playwright Chromium (test:web activation)
        run: npx playwright install chromium

      - name: Syntax check (extension.js + lib + scripts)
        run: |
          node --check extension.js
          find lib -name '*.js' -print0 | while IFS= read -r -d '' f; do node --check "$f" || exit 1; done
          for f in scripts/*.mjs; do node --check "$f" || exit 1; done

      - name: Lint & type-check (ESLint + tsc --checkJs)
        run: npm run check

      - name: Regenerate themes and verify committed output
        run: npm run verify:themes-fresh

      - name: Unit tests (Node + Python)
        run: npm test && npm run test:py

      - name: Build node + web bundles (esbuild)
        run: npm run build:bundle && npm run build:ext

      - name: Web extension tests
        run: npm run test:web

      # `npm run test:web:host` (real @vscode/test-web host, tests/web-suite/index.js)
      # is deliberately NOT wired in here yet: the in-host suite does not currently
      # report a result, so enabling it would fail CI on a harness bug rather than a
      # product one. Fix tests/run-web-host.mjs first, then add the step.

      - name: Package VSIX (smoke test, not uploaded)
        run: npm run package

  jetbrains:
    name: Build JetBrains plugin (smoke)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: |
          npm ci
          pip install -e ".[dev]"

      - name: Export IDE themes + sync JetBrains plugin
        run: |
          npm run export:ide
          npm run jetbrains:sync

      - name: Build JetBrains plugin ZIP
        run: node scripts/run-gradle.mjs buildPlugin --no-daemon
