name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validate themes & pipeline
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          npm ci
          pip install -e ".[dev]"

      - name: Syntax check (extension.js + lib + scripts)
        run: |
          node --check extension.js
          find lib -name '*.js' -print0 | while IFS= read -r -d '' f; do node --check "$f" || exit 1; done
          for f in scripts/*.mjs; do node --check "$f" || exit 1; done

      - name: Regenerate themes and verify committed output
        run: npm run verify:themes-fresh

      - name: Unit tests
        run: npm run test:all

      - name: Package VSIX (smoke test, not uploaded)
        run: npm run package

  jetbrains:
    name: Build JetBrains plugin (smoke)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
          cache: pip

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: |
          npm ci
          pip install -e ".[dev]"

      - name: Export IDE themes + sync JetBrains plugin
        run: |
          npm run export:ide
          npm run jetbrains:sync

      - name: Build JetBrains plugin ZIP
        run: node scripts/run-gradle.mjs buildPlugin --no-daemon
