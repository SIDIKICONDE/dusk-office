name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validate themes & pipeline
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Syntax check (extension.js + scripts)
        run: |
          node --check extension.js
          for f in scripts/*.mjs; do node --check "$f" || exit 1; done

      - name: Validate themes (palette, pipeline, terminal contrast)
        run: npm run validate

      - name: Package VSIX (smoke test, not uploaded)
        run: npm run package
