[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "dusk-office-tools"
version = "1.3.5"
description = "Offline audit and validation tools for the Dusk Office theme pack"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
dependencies = [
  "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
  "Pillow>=10.0",
  "pytest>=8.0",
]

[project.scripts]
dusk-analyze = "dusk_office.analyze_themes:main"
dusk-validate = "dusk_office.validate_schemas:main"
dusk-embed-icon = "dusk_office.embed_plugin_icon:main"

[tool.setuptools.packages.find]
where = ["python"]

[tool.pytest.ini_options]
testpaths = ["python/tests"]
pythonpath = ["python"]
