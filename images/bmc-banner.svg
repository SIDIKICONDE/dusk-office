<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="500" viewBox="0 0 1500 500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#031c28"/>
      <stop offset="50%" style="stop-color:#0a1e2e"/>
      <stop offset="100%" style="stop-color:#0d2234"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#c9a85c"/>
      <stop offset="100%" style="stop-color:#e0c07a"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="1500" height="500" fill="url(#bg)"/>
  <!-- Subtle grid pattern -->
  <g opacity="0.04">
    <line x1="0" y1="100" x2="1500" y2="100" stroke="#d1e0e8" stroke-width="0.5"/>
    <line x1="0" y1="200" x2="1500" y2="200" stroke="#d1e0e8" stroke-width="0.5"/>
    <line x1="0" y1="300" x2="1500" y2="300" stroke="#d1e0e8" stroke-width="0.5"/>
    <line x1="0" y1="400" x2="1500" y2="400" stroke="#d1e0e8" stroke-width="0.5"/>
    <line x1="300" y1="0" x2="300" y2="500" stroke="#d1e0e8" stroke-width="0.5"/>
    <line x1="600" y1="0" x2="600" y2="500" stroke="#d1e0e8" stroke-width="0.5"/>
    <line x1="900" y1="0" x2="900" y2="500" stroke="#d1e0e8" stroke-width="0.5"/>
    <line x1="1200" y1="0" x2="1200" y2="500" stroke="#d1e0e8" stroke-width="0.5"/>
  </g>
  <!-- Decorative code lines left -->
  <g opacity="0.15" font-family="'SF Mono','Fira Code','Consolas',monospace" font-size="14" fill="#556f83">
    <text x="40" y="80">const theme = await loadTheme();</text>
    <text x="40" y="100">palette.surface = '#031c28';</text>
    <text x="40" y="120">palette.accent  = '#c9a85c';</text>
    <text x="40" y="140">palette.fg      = '#d1e0e8';</text>
    <text x="40" y="170">for (const variant of themes) {</text>
    <text x="40" y="190">  variant.validate();</text>
    <text x="40" y="210">}</text>
  </g>
  <!-- Decorative code lines right -->
  <g opacity="0.1" font-family="'SF Mono','Fira Code','Consolas',monospace" font-size="14" fill="#7f9b87">
    <text x="1100" y="280">terminal.bg = '#02060b';</text>
    <text x="1100" y="300">contrast.check(4.5);</text>
    <text x="1100" y="320">semantic.highlight();</text>
    <text x="1100" y="340">export default palette;</text>
  </g>
  <!-- Main title -->
  <text x="750" y="100" text-anchor="middle" font-family="'Inter','SF Pro Display','Segoe UI',sans-serif" font-weight="700" font-size="64" fill="#d1e0e8" letter-spacing="-1">
    Dusk Office
  </text>
  <!-- Subtitle -->
  <text x="750" y="150" text-anchor="middle" font-family="'Inter','SF Pro Display','Segoe UI',sans-serif" font-weight="400" font-size="22" fill="#c9a85c" letter-spacing="2">
    26 THEMES · EYE COMFORT · SEMANTIC CLARITY
  </text>
  <!-- Bottom tagline -->
  <text x="750" y="200" text-anchor="middle" font-family="'Inter','SF Pro Display','Segoe UI',sans-serif" font-weight="300" font-size="16" fill="#899399" letter-spacing="1">
    VS Code · Cursor · Windsurf
  </text>
  <!-- Coffee cup icon -->
  <g transform="translate(710, 220)" fill="none" stroke="#c9a85c" stroke-width="1.5" opacity="0.5">
    <path d="M0,10 L0,30 Q0,40 10,40 L50,40 Q60,40 60,30 L60,10 Z" fill="#c9a85c22"/>
    <path d="M60,15 Q75,15 75,25 Q75,35 60,35"/>
    <line x1="-5" y1="42" x2="65" y2="42" stroke-linecap="round"/>
    <!-- Steam -->
    <path d="M20,5 Q22,-2 20,-8" stroke-linecap="round" opacity="0.4"/>
    <path d="M30,3 Q32,-4 30,-10" stroke-linecap="round" opacity="0.4"/>
    <path d="M40,5 Q42,-2 40,-8" stroke-linecap="round" opacity="0.4"/>
  </g>
  <!-- Theme color swatches -->
  <g transform="translate(580, 270)">
    <rect x="0" y="0" width="20" height="20" rx="4" fill="#031c28" stroke="#c9a85c33" stroke-width="0.5"/>
    <rect x="28" y="0" width="20" height="20" rx="4" fill="#0a1523" stroke="#c9a85c33" stroke-width="0.5"/>
    <rect x="56" y="0" width="20" height="20" rx="4" fill="#3d3648" stroke="#c9a85c33" stroke-width="0.5"/>
    <rect x="84" y="0" width="20" height="20" rx="4" fill="#ece7de" stroke="#c9a85c33" stroke-width="0.5"/>
    <rect x="112" y="0" width="20" height="20" rx="4" fill="#e3e8ec" stroke="#c9a85c33" stroke-width="0.5"/>
    <rect x="140" y="0" width="20" height="20" rx="4" fill="#f6eede" stroke="#c9a85c33" stroke-width="0.5"/>
    <rect x="168" y="0" width="20" height="20" rx="4" fill="#c9a85c" stroke="#c9a85c33" stroke-width="0.5"/>
    <rect x="196" y="0" width="20" height="20" rx="4" fill="#556f83" stroke="#c9a85c33" stroke-width="0.5"/>
    <rect x="224" y="0" width="20" height="20" rx="4" fill="#7f9b87" stroke="#c9a85c33" stroke-width="0.5"/>
    <rect x="252" y="0" width="20" height="20" rx="4" fill="#b86f67" stroke="#c9a85c33" stroke-width="0.5"/>
    <rect x="280" y="0" width="20" height="20" rx="4" fill="#d1e0e8" stroke="#c9a85c33" stroke-width="0.5"/>
  </g>
  <!-- Gold accent line at bottom -->
  <rect x="200" y="320" width="1100" height="2" fill="url(#gold)" opacity="0.3" rx="1"/>
</svg>
